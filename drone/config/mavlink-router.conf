# mavlink-router 설정 — pi3 (X500 v2 컴패니언 컴퓨터)
# drone-mavlink-router.service 가 이 파일을 쓴다.
# 장치 경로는 1단계에서 실측 확정한 값이다 (/dev/serial0 이 아니다).

[General]
# 지상국(QGroundControl)이 Tailscale 로 붙는 포트.
# QGC 접속 주소: 100.85.243.54:5760 (TCP)
TcpServerPort = 5760
MavlinkDialect = auto
DebugLogLevel = info

[UartEndpoint fc]
# FC TELEM2 ↔ GPIO14/15 (40핀 8·10번). /dev/serial0 은 디버그 커넥터라 쓰면 안 된다.
# TELEM1 은 무선 Air Unit 자리다 (2026-09-21 확정 — 처음엔 반대로 알고 있었다).
Device = /dev/ttyAMA0
# 목록으로 두면 유효한 MAVLink 패킷이 올 때까지 순환하며 시도한다.
# 921600 이 정상값이고 57600 은 FC 파라미터가 아직 안 잡힌 경우의 보험이다.
Baud = 921600,57600

[UdpEndpoint local_ctrl]
# 라즈베리파이 안의 제어 코드(MAVSDK). 6단계 스크립트가 udpin://0.0.0.0:14540 으로 받는다.
Mode = Normal
Address = 127.0.0.1
Port = 14540

[UdpEndpoint linkmon]
# drone-linkmon.service 전용. 읽기만 한다.
# 14540 을 쓰면 MAVSDK 제어 코드와 포트를 다투게 되므로 따로 뺐다.
Mode = Normal
Address = 127.0.0.1
Port = 14541

[UdpEndpoint detect]
# drone-detect.service 가 드론 모드일 때 링크 끊김을 감시하는 용도. 읽기만 한다.
Mode = Normal
Address = 127.0.0.1
Port = 14542

[UdpEndpoint bridge]
# drone-node.service(가시화 브리지) 전용. 읽기만 한다 — 브리지는 FC 로 0바이트를 보낸다.
# 14540 은 MAVSDK 제어 코드 자리라 쓰지 않는다 (2026-09-21 브리지 작업에서 추가).
Mode = Normal
Address = 127.0.0.1
Port = 14543
