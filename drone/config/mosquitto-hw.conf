# 피지컬팀 mk2 — pi3 로컬 MQTT 브로커 설정 (X500 v2 드론)
#   설치: sudo cp ~/drone/config/mosquitto-hw.conf /etc/mosquitto/conf.d/hw.conf
#         sudo systemctl restart mosquitto
#
# 원본은 저장소 HW 브랜치의 pi/deploy/mosquitto-hw.conf (pi7/Go1 용)이다. 포트·정책을
# 그대로 맞춘다 — 웹은 로봇 칸 주소를 pi7 에서 pi3 로 바꾸기만 하면 드론에 붙는다.
#
# 왜 드론 옆(pi3)에 브로커를 두나
#   현장 네트워크가 핫스팟으로 자주 바뀐다. 브로커가 노트북이나 서버에 있으면 그 주소가
#   바뀔 때마다 말단 설정을 고쳐야 하고, 그 장비가 꺼지면 경로 자체가 죽는다. pi3 는
#   기체와 같은 자리에 있고 mDNS 이름(pi3.local)이 IP 변화와 무관하다.
#   ※ 이번 구조는 서버를 거치지 않는 온디바이스 직통이다(웹 → pi3 브로커).
#
# ⚠ 여기에는 **기본 mosquitto.conf 에 없는 것만** 적는다. persistence/persistence_location/
#   log_dest 는 기본 설정에 이미 있고, mosquitto 는 그런 중복을 오류로 보고 기동을 거부한다
#   ("Duplicate persistence_location value" 로 죽은 전례가 있다).

# mosquitto 2.x 는 기본이 localhost 전용이라 명시적으로 열어야 외부가 붙는다.
listener 1883 0.0.0.0

# 인증은 아직 없다. BE-T-01 의 TLS/인증이 준비되면 여기에 붙인다
# (그 전까지는 현장망이 폐쇄망이라는 전제다 — 공개망에 그대로 두지 말 것).
allow_anonymous true

# 브라우저에서 직접 붙는 경로(가시화 웹). 브라우저 JS 는 생 TCP 를 못 열어서 1883 으로는
# 못 붙는다 — MQTT over WebSocket 이 필요하다. 같은 브로커·같은 토픽이고 전송 계층만 다르다
# (드론 노드는 계속 1883 을 쓴다).
# ⚠ https 로 서비스되는 페이지에서는 ws:// 가 mixed content 로 차단된다. 웹을 http 로
#   띄우거나, 브로커에 TLS(wss)를 붙여야 한다 — 후자는 BE-T-01 인증서 준비 후.
listener 9001 0.0.0.0
protocol websockets

# 말단 keepalive 는 10초(common/config.py KEEPALIVE). 상한을 넉넉히 둬 정상 연결이
# 끊기지 않게 한다.
max_keepalive 300
