# drone-node.service 덮어쓰기 — 60-flight-runner.conf 위에 얹어 실행 명령만 flight_runner.node_seq 로 바꾼다.
# 60 번이 준 환경(PYTHONPATH · XDG_RUNTIME_DIR · DBUS · ReadWritePaths)은 그대로 물려받는다.
#
#   node_seq = with_mission_seq(with_flight_runner(DroneNode))
#   → 기존 rtk_test_start / stop / emergency 와 flight_run 은 그대로, seq_mission_start / stop 과 mission_run 이 더해진다.
#
# 설치: sudo ~/drone/flight_runner/deploy/install_seq.sh --install
# 되돌리기: sudo ~/drone/flight_runner/deploy/install_seq.sh --uninstall   (= 이 파일만 지우고 drone-node 재시작 → 60 번 상태로)
[Service]
ExecStart=
ExecStart=/home/physical/drone/venv/bin/python3 -u -m flight_runner.node_seq --node drone.drone_node:DroneNode
