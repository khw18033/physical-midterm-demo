# drone-node.service 덮어쓰기 — 실행 명령만 flight_runner.node 로 바꾼다 (HW 의 drone-node.service · ~/hw 코드는 그대로)
#
# 설치: sudo ~/drone/flight_runner/deploy/install.sh --install   (이 파일의 @UID@ 를 physical 의 uid 로 바꿔 넣는다)
# 되돌리기: sudo ~/drone/flight_runner/deploy/install.sh --uninstall   (= 이 파일을 지우고 drone-node 재시작)
#
# ⚠ sar_pass.agent 덮어쓰기(50-sar.conf)가 있으면 둘 다 ExecStart 를 바꾸므로 뒤의 것(이 파일)만 산다 —
#   install.sh 가 그 경우 설치를 멈춘다. 둘을 함께 쓰려면 노드 클래스를 겹쳐 감싸야 한다(PI3_작업_261014.md §5).
[Service]
EnvironmentFile=-/etc/flight-runner.env
# flight_runner 패키지가 ~/drone 에 있다. 노드 코드(common · drone)는 WorkingDirectory(~/hw/pi)에서 찾는다.
Environment=PYTHONPATH=/home/physical/drone
# 비행 스크립트는 사용자 systemd 의 별도 유닛으로 뜬다(systemd-run --user) — 노드의 cgroup 밖이라 노드가
# 재시작돼도 비행은 계속된다. 노드는 NoNewPrivileges=yes 라 sudo 를 못 쓰므로 사용자 관리자로 간다.
Environment=XDG_RUNTIME_DIR=/run/user/@UID@
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/@UID@/bus
ExecStart=
ExecStart=/home/physical/drone/venv/bin/python3 -u -m flight_runner.node --node drone.drone_node:DroneNode
# ProtectSystem=strict 안에서 실행기가 출력 · 상태 파일을 쓰는 자리
ReadWritePaths=-/home/physical/cansar_logs
